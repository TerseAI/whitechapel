<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Whitechapel — environment production review</title>
<style>body{margin:0;background:#252a26}canvas{display:block}#label{position:fixed;left:28px;top:24px;color:#ddd0b5;font:16px Georgia;letter-spacing:.05em}</style>
<div id="label"></div>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const params=new URLSearchParams(location.search);
const id=params.get('scene')||'lantern-common';
const evidenceView=params.get('view');
document.querySelector('#label').textContent=id.replaceAll('-',' ').toUpperCase();
if(evidenceView)document.querySelector('#label').hidden=true;
const scene=new THREE.Scene();scene.background=new THREE.Color('#363830');
scene.fog=new THREE.FogExp2('#263733',.012);
scene.add(new THREE.AmbientLight('#c8dbe8',.9),new THREE.HemisphereLight('#91b4d0','#4f483c',2.1));
const sun=new THREE.DirectionalLight('#b4cde3',2.8);sun.position.set(-8,18,-10);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-20,right:20,top:20,bottom:-20});sun.shadow.bias=-.0003;scene.add(sun);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,90);camera.position.set(0,6.8,12.3);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1.3);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.append(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1,-.3);controls.update();
if(evidenceView==='service-route'){
  camera.position.set(-3.7,2.3,-1.1);controls.target.set(-1.05,1.05,-5.9);camera.fov=56;
}
if(evidenceView==='window-view'){
  camera.position.set(-.1,1.7,.6);controls.target.set(1.05,.6,-3.7);camera.fov=80;
}
camera.updateProjectionMatrix();controls.update();
const model=await new GLTFLoader().loadAsync(`../assets/models/${id}.glb`);model.scene.traverse(node=>{if(node.isMesh){node.castShadow=true;node.receiveShadow=true;}});scene.add(model.scene);
const fragment=await fetch('scenes.json').then(response=>response.json());
for(const [name,point] of Object.entries(fragment.locations[id].navigation.clues)) {
  const object=Object.entries(fragment.objects).find(([key])=>({trunk:'trunk-interior','cart-candlestick':'cart-candlestick','room-disturbance':'room-disturbance','room-fragment':'room-fragment','sewing-case':'torn-wedding','service-route':'service-route','hearth-remains':'hearth-knife','unfinished-work':'unfinished-work'}[key]===name));
  if(object){const loaded=await new GLTFLoader().loadAsync(`../assets/${fragment.models[object[1].asset]}`);loaded.scene.position.set(...point);loaded.scene.traverse(node=>{if(node.isMesh){node.castShadow=true;node.receiveShadow=true;}});scene.add(loaded.scene);}
}
renderer.setAnimationLoop(()=>renderer.render(scene,camera));
window.previewReady=true;
</script>
</html>
